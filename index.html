<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دعوة زفاف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#FBF3E7;--bg-2:#F3E6D3;--card:#F3E6D3;--gold:#B08C55;--gold-soft:#D9C093;--green:#6E2C3B;--ink:#4A2E33;--muted:#6E2C3B;--line:rgba(176,140,85,.35)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Tajawal",sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;background-image:radial-gradient(120% 70% at 50% -5%,rgba(184,146,78,.16),transparent 55%),linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);background-attachment:fixed}
body.locked{overflow:hidden;height:100vh}
body.lang-en .display{font-family:"Cormorant Garamond",serif;font-weight:600}

.cover{position:fixed;inset:0;z-index:1000;background:transparent;overflow:hidden}
.cover .hint{position:absolute;bottom:64px;inset-inline:0;text-align:center;color:var(--muted);font-size:1rem;letter-spacing:.5px;z-index:6;transition:opacity .4s}
.flap{position:absolute;top:0;bottom:0;width:50.4%;background:linear-gradient(180deg,#FBFAF7,#F1EDE4);transition:transform 1.05s cubic-bezier(.76,0,.24,1);z-index:3}
.flap.left{left:0;box-shadow:inset -1px 0 0 var(--gold),8px 0 30px rgba(62,48,37,.08)}
.flap.right{right:0;box-shadow:inset 1px 0 0 var(--gold),-8px 0 30px rgba(62,48,37,.08)}
.seam{position:absolute;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(180deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);transform:translateX(-50%);z-index:4;transition:opacity .5s}
.seal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:132px;height:132px;border-radius:50%;z-index:5;cursor:pointer;background:radial-gradient(circle at 38% 34%,#E8CE96,#C6A15B 55%,#9C7635 100%);box-shadow:0 10px 26px rgba(120,86,32,.4),inset 0 2px 6px rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;transition:transform .5s ease,opacity .5s ease}
.seal::before{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55)}
.seal .mono{font-weight:600;font-size:1.7rem;color:#5A4218;letter-spacing:1px;text-shadow:0 1px 1px rgba(255,255,255,.4)}
.seal:hover{transform:translate(-50%,-50%) scale(1.05)}
.cover.open .flap.left{transform:translateX(-101%)}
.cover.open .flap.right{transform:translateX(101%)}
.cover.open .seal{transform:translate(-50%,-50%) scale(.3);opacity:0}
.cover.open .seam,.cover.open .hint{opacity:0}
.cover.loading{background:#EFEAE0}
.cover.loading>*{opacity:0!important}

/* ===== غلاف الحنة: باب تراثي + تطريز ===== */
.henna-band{position:absolute;left:0;right:0;height:46px;z-index:6;display:none;background-repeat:repeat-x;background-size:auto 46px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2744%27%20height%3D%2746%27%20viewBox%3D%270%200%2044%2046%27%3E%3Crect%20width%3D%2744%27%20height%3D%2746%27%20fill%3D%27%23FBF3E7%27%2F%3E%3Cpath%20d%3D%27M0%2046%20L22%204%20L44%2046Z%27%20fill%3D%27%236E2C3B%27%2F%3E%3Cpath%20d%3D%27M9%2046%20L22%2022%20L35%2046Z%27%20fill%3D%27%23B08C55%27%2F%3E%3Cpath%20d%3D%27M16%2046%20L22%2033%20L28%2046Z%27%20fill%3D%27%232b1a1e%27%2F%3E%3Crect%20x%3D%2720%27%20y%3D%270%27%20width%3D%274%27%20height%3D%276%27%20fill%3D%27%236E2C3B%27%2F%3E%3C%2Fsvg%3E")}
.henna-band.top{top:0;border-bottom:2px solid var(--gold)}
.henna-band.bottom{bottom:0;transform:scaleY(-1);border-top:2px solid var(--gold)}
.cover.henna .henna-band{display:block}
.cover.henna .flap{background-color:#6E2C3B;background:
  radial-gradient(circle at 30px 44px, rgba(0,0,0,.38) 2.4px, transparent 3.4px) 0 46px/62px 92px,
  repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 1px, transparent 1px 44px),
  linear-gradient(90deg,#54202c,#7a3341 50%,#54202c);
  box-shadow:none}
.cover.henna .flap.left{box-shadow:inset -2px 0 0 var(--gold),6px 0 24px rgba(0,0,0,.2)}
.cover.henna .flap.right{box-shadow:inset 2px 0 0 var(--gold),-6px 0 24px rgba(0,0,0,.2)}
.cover.henna .seam{background:linear-gradient(180deg,transparent,var(--gold) 12%,var(--gold) 88%,transparent);width:4px}
.cover.henna .seal{width:104px;height:132px;border-radius:0;background:transparent;box-shadow:none}
.cover.henna .seal::before{display:none}
.cover.henna .seal .mono{display:none}
.knocker{display:none}
.knocker svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.cover.henna .knocker{display:block;width:100%;height:100%}
.cover.henna .hint{color:#F6E9CE}

.music-btn{position:fixed;bottom:16px;inset-inline-start:16px;z-index:1200;width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;background:var(--green);color:#F3EAD9;font-size:1.1rem;display:none;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(46,74,58,.35)}

.wrap{max-width:600px;margin:0 auto;padding:56px 22px 46px}
.reveal{opacity:0;transform:translateY(20px)}
.opened .reveal{animation:up .9s ease forwards}
.opened .d1{animation-delay:.15s}.opened .d3{animation-delay:.55s}.opened .d4{animation-delay:.75s}.opened .d5{animation-delay:.95s}.opened .d6{animation-delay:1.15s}
@keyframes up{to{opacity:1;transform:none}}

.invite-card{background:transparent;border:0;border-radius:0;padding:14px 20px 26px;box-shadow:none;text-align:center}
.invite-card.boxed{background:var(--card);border:1px solid var(--line);border-radius:170px 170px 22px 22px;padding:48px 26px 40px;box-shadow:0 20px 50px rgba(62,48,37,.14)}
.invite-card.frame2{position:relative;background:var(--card);border:1.5px solid var(--gold);border-radius:8px;padding:46px 30px;box-shadow:0 16px 40px rgba(62,48,37,.12)}
.invite-card.frame2::before{content:"";position:absolute;inset:6px;border:1px solid var(--gold);border-radius:4px;opacity:.55;pointer-events:none}
.invite-card.frame2::after{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:60px;height:14px;background:radial-gradient(circle at 50% 0,var(--gold) 0 3px,transparent 4px) 0 0/12px 14px repeat-x;opacity:.8}
.frame{position:fixed;inset:12px;border:1px solid var(--line);border-radius:4px;pointer-events:none;z-index:2}
.frame::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);border-radius:2px;opacity:.6}
.floral{margin:26px auto;text-align:center;color:var(--gold);line-height:0}
.floral svg{display:inline-block;width:170px;max-width:62%;height:auto}
.bismillah{font-family:"Amiri",serif;font-size:1.5rem;color:var(--green);margin-bottom:16px}
.henna-intro{font-family:"Amiri",serif;color:var(--green);font-size:1.15rem;line-height:2;max-width:440px;margin:0 auto 16px;white-space:pre-line}
.henna-bg{display:none;position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:600px;z-index:0;background-image:url("/henna-bg.jpg");background-size:cover;background-position:top center;background-repeat:no-repeat;transform:translateX(-50%) translateZ(0);will-change:transform;backface-visibility:hidden}
body.henna-card{background:#efe9e0;background-image:radial-gradient(120% 60% at 50% 0%,#f7f3ec,#e7ddd0)}
body.henna-card .henna-bg{display:block}
body.henna-card .wrap{position:relative;z-index:1}
body.henna-card .frame{display:none}
body.henna-card .invite-card.boxed{background:rgba(251,243,231,.78);backdrop-filter:blur(1px);max-width:78%;margin:0 auto;border-color:rgba(176,140,85,.4)}


body.henna-card 
body.henna-card 
.verse{font-family:"Amiri",serif;color:var(--muted);font-size:1.02rem;line-height:2.1;max-width:420px;margin:0 auto 30px}
.blessing{color:var(--muted);font-size:1rem;line-height:1.9;max-width:440px;margin:0 auto 26px}
.couple{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin:14px 0 18px}
.couple .person{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.couple .father{color:var(--muted);font-size:.92rem;font-weight:500}
.couple .rel{color:var(--muted);font-size:.88rem;font-weight:500;font-style:italic}
.couple .title{color:var(--green);font-size:.9rem;font-weight:700}
.couple .name-txt{font-family:"Aref Ruqaa",serif;color:var(--ink);font-size:clamp(2rem,9vw,3rem);line-height:1.2;letter-spacing:.5px}
.couple .family{font-family:"Aref Ruqaa",serif;color:var(--ink);font-size:clamp(2rem,9vw,3rem);line-height:1.2;letter-spacing:.5px;margin-bottom:2px}
.rings{width:44px;height:26px;flex:0 0 auto;margin-bottom:10px;color:var(--gold)}
.rings circle{fill:none;stroke:var(--gold);stroke-width:2}
.willing{font-family:"Amiri",serif;color:var(--muted);font-size:1rem;margin-bottom:6px}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:28px 0}
.rule .l{height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule .l.r{background:linear-gradient(90deg,var(--gold),transparent)}
.rule .d{width:8px;height:8px;transform:rotate(45deg);background:var(--gold)}
.info-row{display:flex;gap:18px;justify-content:center;text-align:center;flex-wrap:wrap}
.event-info{display:flex;flex-direction:column;gap:14px;max-width:320px;margin:22px auto 0}
.ev-item{display:flex;align-items:center;gap:14px;text-align:start}
.ev-ic{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,var(--gold),var(--gold-soft));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.ev-ic svg{width:23px;height:23px}
.ev-l{color:var(--muted);font-size:.82rem;letter-spacing:.3px;margin-bottom:1px}
.ev-v{color:var(--ink);font-size:1.14rem;font-weight:700;line-height:1.35}
.ev-venue-name{color:var(--green);font-weight:700;font-size:1.05rem}
.info-col{flex:1;min-width:180px}
.info-head{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--green);font-weight:700;font-size:1.12rem;margin-bottom:8px;letter-spacing:.3px}
.info-col .sub{color:var(--muted);font-size:.98rem;line-height:1.9}
.map-btn{display:inline-flex;align-items:center;gap:8px;margin-top:26px;background:var(--green);color:#F6F3EC;font-weight:600;font-size:.98rem;letter-spacing:1.2px;text-decoration:none;padding:13px 32px;border-radius:2px;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 22px rgba(44,74,59,.20)}
.map-btn:hover{transform:translateY(-2px)}
.map-embed{margin-top:20px;border-radius:14px;overflow:hidden;border:1px solid var(--line);line-height:0}
.map-embed iframe{width:100%;height:220px;border:0;filter:sepia(.12)}
.notes{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:30px;padding-top:4px}
.note{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.92rem}
.section-title{text-align:center;font-family:"Aref Ruqaa",serif;color:var(--green);font-size:1.6rem;margin-bottom:22px;letter-spacing:.5px}
.block{margin-top:48px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;direction:ltr}
.cd-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 6px 12px;text-align:center}
.cd-num{font-weight:700;font-size:clamp(1.7rem,8vw,2.5rem);color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.cd-label{margin-top:8px;color:var(--muted);font-size:.85rem}
.cd-done{grid-column:1/-1;text-align:center;font-family:"Aref Ruqaa",serif;color:var(--green);font-size:1.5rem;padding:16px}
.couple-photo{width:min(230px,62vw);aspect-ratio:3/3.4;margin:0 auto 26px;border-radius:999px 999px 18px 18px;overflow:hidden;border:3px solid var(--gold)}
.couple-photo.big{width:min(330px,84vw);aspect-ratio:3/3.6;border-radius:20px}
.gradcap{display:none}
.gradcap svg{width:100%;height:100%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4))}
.cover.gradbook .seal{width:120px;height:110px;background:transparent;box-shadow:none;border-radius:0}
.cover.gradbook .seal::before{display:none}
.cover.gradbook .seal .mono,.cover.gradbook .knocker{display:none}
.cover.gradbook .gradcap{display:block;width:100%;height:100%}
.couple-photo img{width:100%;height:100%;object-fit:cover;display:block}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-radius:16px;cursor:grab}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:0 0 100%;width:100%;aspect-ratio:3/4;object-fit:contain;background:rgba(110,44,59,.06);scroll-snap-align:center;scroll-snap-stop:always;border:1px solid var(--line);border-radius:16px;user-select:none;-webkit-user-drag:none}
.gallery-dots{display:flex;gap:7px;justify-content:center;margin-top:12px}
.gallery-dots span{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.gallery-dots span.on{background:var(--gold);transform:scale(1.25)}
.card-video{width:100%;border-radius:16px;border:1px solid var(--line);margin-top:4px;background:#000;display:block}
.lightbox{position:fixed;inset:0;background:rgba(46,37,25,.92);display:none;align-items:center;justify-content:center;padding:24px;z-index:1300;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:90vh;border-radius:14px}
.footer{text-align:center;color:var(--muted);font-size:1rem;line-height:2;margin-top:42px}
.footer .heart{color:var(--gold)}
.rsvp-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;max-width:520px;margin:0 auto}
.rsvp-lbl{display:block;text-align:center;color:var(--green);font-weight:700;font-size:.98rem;margin:16px 2px 8px}
.rsvp-in{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:1rem;color:var(--ink);outline:none}
.rsvp-in:focus{border-color:var(--gold)}
textarea.rsvp-in{resize:vertical}
.att-row{display:flex;gap:12px;margin-top:6px}
.att-btn{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;font-family:inherit;font-size:1rem;color:var(--ink);cursor:pointer;transition:.2s}
.att-btn.yes.active{background:var(--green);color:#F3EAD9;border-color:var(--green)}
.att-btn.no.active{background:#9C4A3C;color:#F3EAD9;border-color:#9C4A3C}
.rsvp-err{color:#9C4A3C;font-size:.9rem;margin-top:12px;min-height:1em;text-align:center}
.rsvp-send{width:100%;margin-top:20px;background:var(--gold);color:#3A2817;border:0;border-radius:50px;padding:14px;font-family:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;transition:.2s;box-shadow:0 8px 22px rgba(184,146,78,.3)}
.rsvp-send:hover{transform:translateY(-2px)}
.rsvp-send:disabled{opacity:.6}
.rsvp-done{text-align:center;font-family:"Aref Ruqaa",serif;color:var(--green);font-size:1.4rem;padding:22px 6px;line-height:1.7}
@media (prefers-reduced-motion:reduce){.reveal{animation:none!important;opacity:1;transform:none}.flap,.seal{transition:none}}
</style>
</head>

      </div>

        <span class="ev-ic"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg></span>
        <div><div class="ev-v ev-venue-name" id="venueName"></div><div class="ev-l" id="venueSub" style="font-size:.92rem"></div></div>
      </div>
    </div>
    <a class="map-btn" id="mapBtn" target="_blank" rel="noopener"></a>
    <div class="notes" id="notesRow">
      <div class="note"><span>📷</span><span id="notePhoto"></span></div>
      <div class="note"><span>🌙</span><span id="noteKids"></span></div>
    </div>
  </div>

  <div class="block reveal d3" id="countdownBlock">
    <h2 class="section-title" id="countdownTitle"></h2>
    <div class="countdown" id="countdown">
      <div class="cd-box"><div class="cd-num" id="days">--</div><div class="cd-label" id="lblDays"></div></div>
      <div class="cd-box"><div class="cd-num" id="hours">--</div><div class="cd-label" id="lblHours"></div></div>
      <div class="cd-box"><div class="cd-num" id="mins">--</div><div class="cd-label" id="lblMins"></div></div>
      <div class="cd-box"><div class="cd-num" id="secs">--</div><div class="cd-label" id="lblSecs"></div></div>
    </div>
  </div>

  <div class="block reveal d4" id="gallerySection" style="display:none">
    <h2 class="section-title" id="galleryTitle"></h2>
    <div class="gallery" id="gallery"></div>
    <div class="gallery-dots" id="galleryDots"></div>
  </div>

  <div class="block reveal d4" id="videoSection" style="display:none">
    <h2 class="section-title" id="videoTitle"></h2>
    <video class="card-video" id="cardVideo" controls playsinline preload="metadata"></video>
  </div>

  <div class="block reveal d5" id="rsvpBlock"></div>
  <p class="footer reveal d6" id="footer"></p>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<script src="/invite.js?v=24"></script>
</body>
